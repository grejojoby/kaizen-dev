<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#f3efe6">
  <title>Page not found — Kaizen Dev</title>
  <style>
    :root { color-scheme: light; --paper: #f3efe6; --ink: #20252b; --indigo: #1d3458; --red: #c94d37; --muted: #62666a; }
    * { box-sizing: border-box; }
    body { display: grid; min-height: 100vh; margin: 0; place-items: center; background: var(--paper); color: var(--ink); font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    main { width: min(620px, calc(100% - 40px)); padding: 54px 0; }
    .mark { display: inline-grid; width: 42px; height: 42px; margin-bottom: 30px; place-items: center; border: 1px solid var(--indigo); color: var(--red); font: 20px Georgia, serif; }
    p { margin: 0 0 15px; color: var(--muted); font-size: 12px; letter-spacing: .11em; text-transform: uppercase; }
    h1 { margin: 0; font: 500 clamp(46px, 11vw, 74px)/1.02 Georgia, serif; letter-spacing: -.065em; }
    h1 em { color: var(--red); font-weight: 500; }
    .copy { max-width: 430px; margin: 20px 0 28px; color: var(--muted); font-size: 15px; line-height: 1.7; }
    a { display: inline-flex; min-height: 46px; align-items: center; gap: 12px; padding: 0 16px; background: var(--indigo); color: #fff; font-size: 12px; font-weight: 700; text-decoration: none; }
    a:hover { background: #30496d; }
    a:focus-visible { outline: 3px solid var(--red); outline-offset: 4px; }
  </style>
</head>
<body>
  <main>
    <span class="mark" aria-hidden="true">K/</span>
    <p>404 / ROUTE NOT FOUND</p>
    <h1>Wrong path.<br><em>Good habit.</em></h1>
    <p class="copy">This page isn’t in the route map. Go back to the source and start from the actual entry point.</p>
    <a href="https://grejojoby.github.io/kaizen-dev/">Return to Kaizen Dev <span aria-hidden="true">↗</span></a>
  </main>
</body>
</html>
