<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#080b12">
  <title>Page not found — Kaizen Dev</title>
  <style>
    :root { color-scheme: dark; --bg:#080b12; --panel:#101722; --ink:#f2f6fc; --muted:#a4b0c2; --lime:#c2ff58; --violet:#8574ff; --line:rgba(184,199,222,.16); }
    * { box-sizing:border-box; }
    body { display:grid; min-height:100vh; margin:0; place-items:center; overflow:hidden; background:radial-gradient(ellipse at 72% 35%,rgba(94,80,207,.16),transparent 43%),var(--bg); color:var(--ink); font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif; }
    main { position:relative; width:min(680px,calc(100% - 40px)); padding:54px 0; }
    main::before { position:absolute; z-index:-1; top:30px; right:-12%; width:58%; height:70%; border:1px solid var(--line); border-radius:18px; background:linear-gradient(145deg,rgba(21,30,43,.72),rgba(9,14,23,.28)); content:""; transform:rotate(5deg); }
    .mark { display:grid; width:44px; height:44px; margin-bottom:29px; place-items:center; border:1px solid rgba(194,255,88,.3); border-radius:10px; color:var(--lime); font:700 17px ui-monospace,monospace; }
    .eyebrow { margin:0 0 20px; color:var(--lime); font:9px ui-monospace,monospace; letter-spacing:.13em; text-transform:uppercase; }
    h1 { margin:0; font-size:clamp(47px,10vw,76px); font-weight:760; line-height:.99; letter-spacing:-.075em; }
    h1 span { color:var(--lime); }
    .copy { max-width:440px; margin:21px 0 27px; color:var(--muted); font-size:14px; line-height:1.8; }
    a { display:inline-flex; min-height:45px; align-items:center; gap:10px; padding:0 15px; border-radius:6px; background:var(--lime); color:var(--bg); font-size:11px; font-weight:730; text-decoration:none; }
    a:hover { background:#d5ff8b; }
    a:focus-visible { outline:3px solid var(--violet); outline-offset:4px; }
  </style>
</head>
<body>
  <main>
    <span class="mark" aria-hidden="true">K/</span>
    <p class="eyebrow">404 / ROUTE NOT FOUND</p>
    <h1>Wrong path.<br><span>Good habit.</span></h1>
    <p class="copy">This page isn’t in the route map. Go back to the source and start from the actual entry point.</p>
    <a href="https://grejojoby.github.io/kaizen-dev/">Return to Kaizen Dev <span aria-hidden="true">↗</span></a>
  </main>
</body>
</html>
